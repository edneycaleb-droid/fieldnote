name: Skill Quality Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "agents/skill_quality.py"
      - "agents/__init__.py"
      - "governance/skill_quality_policy.json"
      - "scripts/audit_skills.py"
      - "scripts/check_repository_quality.py"
      - "scripts/diagnose_repository_quality.py"
      - "tests/test_skill_quality_governance.py"
      - "tests/test_repository_quality.py"
      - "skills/**"
      - "docs/SKILL_QUALITY_GOVERNANCE.md"
      - ".github/workflows/skill-quality-audit.yml"
  push:
    branches: [main]
    paths:
      - "agents/skill_quality.py"
      - "agents/__init__.py"
      - "governance/skill_quality_policy.json"
      - "scripts/audit_skills.py"
      - "scripts/check_repository_quality.py"
      - "scripts/diagnose_repository_quality.py"
      - "tests/test_skill_quality_governance.py"
      - "tests/test_repository_quality.py"
      - "skills/**"
      - "docs/SKILL_QUALITY_GOVERNANCE.md"
      - ".github/workflows/skill-quality-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-quality-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run governance unit tests
        run: python3 -m unittest discover -s tests -p 'test_skill_quality_governance.py' -v
      - name: Generate repository quality diagnostics
        run: python3 scripts/diagnose_repository_quality.py > /tmp/fieldnote-repository-quality.json
      - name: Upload repository quality diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldnote-repository-quality-diagnostics
          path: /tmp/fieldnote-repository-quality.json
          retention-days: 7
      - name: Run published ten-control repository gate
        run: python3 scripts/check_repository_quality.py
      - name: Run published ten-control rubric tests
        run: python3 -m unittest discover -s tests -p 'test_repository_quality.py' -v
      - name: Audit full historical skill library
        run: python3 scripts/audit_skills.py skills --output /tmp/fieldnote-skill-quality.json --fail-on none
      - name: Compile changed Python policy code
        run: python3 -m compileall -q agents scripts/audit_skills.py scripts/diagnose_repository_quality.py tests/test_skill_quality_governance.py
